volumes:
  spark_events: {}
  openfoodfacts-etl-mysql-data: {}

services:
  spark-master:
    image: ruizhizhong058/spark-master:3.5.1-hadoop3.3.6
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    volumes:
      - ${PWD}/../data:/data
      - ${PWD}/../etl/target:/app
  
  spark-worker-1:
    image: ruizhizhong058/spark-worker:3.5.1-hadoop3.3.6
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8181:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
      - ${PWD}/../data:/data
  
  spark-worker-2:
    image: ruizhizhong058/spark-worker:3.5.1-hadoop3.3.6
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
      - ${PWD}/../data:/data
    
  spark-worker-3:
    image: ruizhizhong058/spark-worker:3.5.1-hadoop3.3.6
    container_name: spark-worker-3
    depends_on:
      - spark-master
    ports:
      - "8183:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
      - ${PWD}/../data:/data
  
  spark-worker-4:
    image: ruizhizhong058/spark-worker:3.5.1-hadoop3.3.6
    container_name: spark-worker-4
    depends_on:
      - spark-master
    ports:
      - "8084:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
      - ${PWD}/../data:/data
  
  spark-history-server:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: spark-history-server
    depends_on:
      - spark-master
    ports:
      - "18081:18081"
    volumes:
      - spark_events:/tmp/spark-events
    environment:
    - "SPARK_MASTER=spark://spark-master:7077"

  mysql:
    container_name: "openfoodfacts-etl-mysql"
    image: "mysql:latest"
    restart: unless-stopped
    volumes:
        - openfoodfacts-etl-mysql-data:/var/lib/mysql
        - ${PWD}/../docs/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
        MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
        - "3306:3306"

  phpmyadmin:
    container_name: "openfoodfacts-etl-phpmyadmin"
    image: "phpmyadmin:latest"
    restart: unless-stopped
    depends_on:
        - mysql
    environment:
        PMA_HOST: mysql
    ports:
        - "8081:80"